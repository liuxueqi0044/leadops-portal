name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: '0'

jobs:
  quality:
    name: Lint / Typecheck / Unit / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://leadops_runtime:ci_build_only@127.0.0.1:5432/leadops
      LEADOPS_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      BETTER_AUTH_SECRET: ci-build-only-not-a-runtime-secret
      BETTER_AUTH_URL: http://127.0.0.1:3200
      OTEL_ENABLED: 'true'
      OTEL_EXPORTER_OTLP_ENDPOINT: http://127.0.0.1:4318
      CORS_ORIGIN: http://127.0.0.1:3200
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm predev
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @leadops/n8n build
      - run: pnpm build

  database:
    name: Database / Integration / E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BETTER_AUTH_SECRET: ci-test-only-not-a-runtime-secret
      BETTER_AUTH_URL: http://127.0.0.1:3200
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadops
          POSTGRES_PASSWORD: leadops_dev
          POSTGRES_DB: leadops
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database tests
        run: pnpm test:db
        env:
          DATABASE_URL: postgresql://leadops_runtime_test:leadops_runtime_test_dev@localhost:5432/leadops_test
          DATABASE_OWNER_URL: postgresql://leadops:leadops_dev@localhost:5432/leadops
      - name: Integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL: postgresql://leadops_runtime_test:leadops_runtime_test_dev@localhost:5432/leadops_test
          DATABASE_OWNER_URL: postgresql://leadops:leadops_dev@localhost:5432/leadops
      - name: End-to-end tests
        run: pnpm test:e2e
        env:
          DATABASE_URL: postgresql://leadops_runtime_test:leadops_runtime_test_dev@localhost:5432/leadops_test
          DATABASE_OWNER_URL: postgresql://leadops:leadops_dev@localhost:5432/leadops
          BETTER_AUTH_SECRET: ci-e2e-placeholder-not-for-production
          BETTER_AUTH_URL: http://127.0.0.1:3200

  security:
    name: Audit / Secrets / License inventory
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned)
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (pinned)
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3 (pinned)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record production license inventory
        run: pnpm licenses list --prod --json > dependency-licenses.json
      - name: Upload license inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned)
        with:
          name: dependency-licenses
          path: dependency-licenses.json
          retention-days: 30
