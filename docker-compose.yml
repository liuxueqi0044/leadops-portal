services:
  postgres:
    image: postgres:16-alpine
    container_name: leadops-postgres
    environment:
      POSTGRES_USER: leadops
      POSTGRES_PASSWORD: leadops_dev
      POSTGRES_DB: leadops
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadops -d leadops"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
